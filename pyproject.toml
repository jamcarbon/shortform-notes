[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "shortform-notes"
version = "0.1.0"
description = "Turn Instagram / Facebook Reels, TikToks and YouTube Shorts into Markdown notes and Notion pages: transcript, selective screenshots, category, AI summary."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
keywords = ["instagram", "facebook", "notion", "reels", "tiktok", "youtube-shorts", "transcription", "obsidian", "markdown", "yt-dlp"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Topic :: Multimedia :: Video",
  "Topic :: Text Processing :: Markup :: Markdown",
]
dependencies = [
  "httpx>=0.27",
  # Deliberately unpinned: yt-dlp's Instagram extractor breaks and is fixed in
  # point releases. Pinning is how other importers rotted within weeks.
  "yt-dlp",
]

[project.optional-dependencies]
openai = ["openai>=1.50"]
anthropic = ["anthropic>=0.40"]
mcp = ["mcp>=1.2"]
# av 19 dropped an argument faster-whisper 1.2.1 still passes to av.open (TypeError on every file).
local = ["faster-whisper>=1.0", "av>=11,<19"]
# GPU Whisper: the CUDA 12 runtime libraries ctranslate2 loads but does not ship. Not needed on
# a machine that already has the CUDA toolkit and cuDNN 9 on PATH. No macOS wheels exist.
cuda = [
  "nvidia-cublas-cu12; platform_system != 'Darwin'",
  "nvidia-cudnn-cu12>=9,<10; platform_system != 'Darwin'",
]
ocr = ["rapidocr-onnxruntime>=1.3", "opencv-python-headless>=4.8", "numpy>=1.24"]
all = ["openai>=1.50", "anthropic>=0.40", "mcp>=1.2"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.6"]

[project.scripts]
shortform-notes = "shortform_notes.cli:main"

[project.urls]
Homepage = "https://github.com/adenjonah/shortform-notes"

[tool.hatch.build.targets.wheel]
packages = ["src/shortform_notes"]

[tool.hatch.build]
include = ["src/shortform_notes/**/*.py", "src/shortform_notes/web/index.html"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ASYNC"]
